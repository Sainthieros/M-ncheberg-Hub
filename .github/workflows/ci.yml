name: CI — Lighthouse & Accessibility

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  audit:
    name: Lighthouse & Pa11y Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install tools
        run: |
          # try to install local deps first, then global tools
          npm ci || true
          npm install -g http-server @lhci/cli pa11y

      - name: Serve site (robust)
        run: |
          # Start http-server and capture logs for troubleshooting
          npx http-server ./ -p 8080 -c-1 > server.log 2>&1 &
          sleep 2
          # Wait for a 200 response (up to ~30s)
          for i in {1..15}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080 || echo "000")
            echo "Health check #$i -> $code"
            [ "$code" = "200" ] && break
            sleep 2
          done
          # If server isn't responding, dump logs but don't fail the job so we can inspect output
          if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080 || echo '000')" != "200" ]; then
            echo "Server did not start; dumping server.log"
            tail -n 200 server.log || true
            ss -ltnp || true
            cat server.log || true
          fi

      - name: Debug server (info)
        run: |
          echo "Server processes:"
          ps aux | grep http-server || true
          ss -ltnp | grep 8080 || true
          curl -I http://localhost:8080 || true
          echo "Server log tail:"
          tail -n 200 server.log || true

      - name: Run Lighthouse CI (upload to temporary storage)
        # Lighthouse will prefer collecting against the running local server (more reliable in CI),
        # and fall back to a staticDistDir if the server isn't available.
        run: |
          set -e
          echo "Attempting LHCI against local server URL..."
          if curl -sf http://localhost:8080 >/dev/null; then
            echo "Server up — running LHCI against http://localhost:8080"
            npx lhci autorun --collect.url=http://localhost:8080 --upload.target=temporary-public-storage || true
          else
            echo "Server not responding; falling back to static collect from repo root"
            npx lhci autorun --collect.staticDistDir=. --upload.target=temporary-public-storage || true
          fi
          echo "LHCI run completed (if any)."

      - name: Run Pa11y accessibility scan
        run: |
          npx pa11y http://localhost:8080 || true
